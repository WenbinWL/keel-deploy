apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canfar-citation-staging
  namespace: canfar-argocd
  labels:
    argocd.argoproj.io/domain: canfar.net
    argocd.argoproj.io/environment: staging
    argocd.argoproj.io/service: citation
spec:
  project: canfar
  sources:
    - repoURL: oci://bucket.canfar.net/charts/citation
      path: .
      targetRevision: 1.0.4
      helm:
        valueFiles:
          - $values/helm/values/canfar.net/citation/base.yaml
          - $values/helm/values/canfar.net/citation/staging.yaml
    - repoURL: https://github.com/cadc-ccda-infra/keel-deploy.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: canfar-system-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
