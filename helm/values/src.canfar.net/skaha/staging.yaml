metrics:
  clusterName: "keel-prod"
  rbac:
    enabled: false
  image:
    # v0.1.6 and later reject retired METRICS_* names. v0.1.7 is the current image.
    tag: v0.1.7
  env:
    METRICS_ENVIRONMENT: "staging"
    METRICS_PROVIDERS__KUEUE__CLUSTER_QUEUES: '["cadc","src"]'
    METRICS_PROVIDERS__KUEUE__NAMESPACES: '["canfar-staging-src-workloads"]'
    # Metrics appends /api/v1/query. Multitenancy is off, so no tenant header.
    METRICS_PROVIDERS__PROMQL__BASE_URL: "http://mimir-distributed-gateway.monitoring.svc/prometheus"
    # Cache integrity key. Chart 1.8.1 renders metricsBackend.env as literal env.
    METRICS_CACHE__KEY_SECRET: "do45TQ9ctvD_Ii0cS_R4Tvx94AEasnPrbD_gVE3-UxV"
    # Chart telemetry.metrics stays false; Metrics OTEL is this env block.
    # Prometheus 3.x OTLP receiver: :4318 is closed; use :9090/api/v1/otlp/v1/metrics.
    METRICS_OTEL__METRICS_ENABLED: "true"
    METRICS_OTEL__SERVICE_NAME: "skaha-metrics"
    METRICS_OTEL__EXPORTER_OTLP_ENDPOINT: "http://prometheus-operated.monitoring.svc:9090/api/v1/otlp/v1/metrics"
    METRICS_OTEL__EXPORT_INTERVAL_MILLIS: "60000"
    METRICS_OTEL__DEPLOYMENT_ENVIRONMENT: "staging"
    METRICS_OTEL__KUBERNETES_NAMESPACE: "canfar-src-staging"

deployment:
  hostname: staging-src.canfar.net
  skaha:
    image: images-integration.canfar.net/skaha-system/skaha:2026.3-rc.4
    imagePullPolicy: Always
    registryHosts: "images-integration.canfar.net services.swesrc.chalmers.se spsrc26.iaa.csic.es"
    posixMapperResourceID: "https://staging-src.canfar.net/posix-mapper"

    registryURL:
      - "https://staging-src.canfar.net/reg"

    sessions:
      hostname: workloads.canfar.net
      namespace:
        create: true
        name: canfar-staging-src-workloads

      userStorage:
        spec:
          persistentVolumeClaim:
            claimName: canfar-staging-src-workloads-pvc
        topLevelDirectory: "/cavern"
        nodeURIPrefix: "vos://canfar.net~src~cavern"
        serviceURI: "ivo://canfar.net/src/cavern"

      gpuEnabled: true

      kueue:
        rbac:
          create: true
        default:
          queueName: "src-default"
          priorityClass: "high"
        headless:
          queueName: "src-default"
          priorityClass: "low"

      # Values that represent boundaries for the session resources.  Tune to your Cluster's capacity.
      limitRange:
        enabled: true
        rbac:
          create: true
        spec:
          # -- max is the maximum allowed requested for 'fixed' User Sessions.
          max:
            memory: "512Gi"
            cpu: "32"
            nvidia.com/gpu: "7"
          # -- default is the default limits for 'flex' User Sessions.  These Sessions will grow until this limit is reached.
          default:
            memory: "32Gi"
            cpu: "16"
            nvidia.com/gpu: "0"
          # -- defaultRequest is the default requests for 'flex' User Sessions.  All flex sessions will start with this request.
          defaultRequest:
            memory: "4Gi"
            cpu: "1"
            nvidia.com/gpu: "0"

      authorization:
        permissionsAPI:
          # @see https://permissions.srcnet.skao.int/api/openapi.json for the API specification.
          # -- When true, SKAHA_PERMISSIONS_API_*_ENABLED is set from baseURL, type, route, name, version, and method. Required baseURL when enabled (Helm validates). The Skaha service enforces mutually exclusive authorization modes at runtime.
          enabled: true
          # -- Required when enabled is true (Helm validates).
          baseURL: "https://permissions.srcnet.skao.int/api"
          authAPIBaseURL: "https://authn.srcnet.skao.int/api"
          name: "canfar-api"
          version: "1"

rbac:
  # Whether to create RBAC roles and bindings for Skaha.  Defaults to true.
  create: true

  # Whether to create a ClusterRole with read-only permissions for Skaha to query Nodes for their capacity.
  # This is used to provide information to the Science Portal UI about available resources in the cluster.
  # A simple node: list permission is granted, but this does require elevated privileges, so it is optional and defaults to false.
  clusterRole:
    create: false

serviceAccount:
  create: true