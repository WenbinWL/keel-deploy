kubernetesClusterDomain: keel-prod.local

# Scaled to zero for a short outage. Quote 0: Helm `default` treats an unquoted 0
# as empty, so replicaCount would become 1 and the HPA bounds would become 2 and 6.
# The HPA stays disabled because Kubernetes rejects maxReplicas 0.
# Restore replicaCount, minReplicas, and maxReplicas to 3 and delete enabled.
replicaCount: "1"

# Science-platform Metrics API (same Helm release as Skaha).
# REQUIRES Skaha Helm chart >= 1.9.0 (opencadc/science-platform#1203 published).
# Do not sync this overlay against chart 1.8.x: Metrics is always required, the
# cache integrity Secret is chart-owned (uuidv4 + lookup), and Redis is only
# via metricsBackend.redis.urlSecret (not Bitnami auto-injection).
#
# The chart injects SKAHA_METRICS_BACKEND_URL on Tomcat so
# GET /v1/session?view=stats reads capacity and allocated from
# GET /apis/canfar.net/v1alpha1/metrics/platform/canfar.
# ClusterQueues `cadc` and `src` match
# keel-deploy/manifests/kueue/clusterQueues/prod.cadc.yml and prod.src.yml.
#
# Capsule on keel-prod forbids chart-managed ClusterRole/ClusterRoleBinding.
# Keep rbac.enabled false. Metrics uses a dedicated ServiceAccount; grant that
# SA ClusterQueue get/list ambiently (same Managed K8s Issues track as Skaha).
metricsBackend:
  platformName: canfar
  # Must match the Mimir/Prometheus series label on this cluster.
  clusterName: keel-prod
  rbac:
    enabled: false
    namespaces:
      - canfar-staging-workloads
  image:
    repository: images.opencadc.org/platform/metrics
    tag: v0.1.7
  # Chart-owned NetworkPolicy defaults deny kube/redis/mimir egress; leave off
  # until exact CIDRs are known for canfar-system-staging.
  networkPolicy:
    enabled: false
  prometheus:
    url: "http://mimir-distributed-gateway.monitoring.svc/prometheus"
  otlp:
    # Prometheus 3.x OTLP receiver: :4318 is closed; use :9090 path.
    endpoint: "http://prometheus-operated.monitoring.svc:9090/api/v1/otlp/v1/metrics"
  redis:
    urlSecret:
      name: canfar-skaha-staging-metrics-redis
      key: redis-url
  env:
    METRICS_PROVIDERS__KUEUE__CLUSTER_QUEUES: '["cadc","src"]'
    # Chart telemetry.metrics stays false; remaining OTEL identity via env.
    METRICS_OTEL__SERVICE_NAME: "skaha-metrics"
    METRICS_OTEL__EXPORT_INTERVAL_MILLIS: "60000"
    METRICS_OTEL__DEPLOYMENT_ENVIRONMENT: "staging"
    METRICS_OTEL__KUBERNETES_NAMESPACE: "canfar-system-staging"

# Redis URL for Metrics (Bitnami master Service of this release). No auth.
# Duplicated into the session workload namespace by the chart secrets template.
secrets:
  canfar-skaha-staging-metrics-redis:
    redis-url: cmVkaXM6Ly9jYW5mYXItc2thaGEtc3RhZ2luZy1yZWRpcy1tYXN0ZXIuY2FuZmFyLXN5c3RlbS1zdGFnaW5nLnN2Yy5rZWVsLXByb2QubG9jYWw6NjM3OS8w

# Skaha Tomcat OTEL metrics (chart skaha >= 1.6.1). Same Prometheus OTLP
# receiver as Metrics above: Java agent uses the OTLP base URL and appends
# /v1/metrics; Metrics Python exporter is given the full metrics path.
# telemetry.metrics stays false in this chart version (reserved).
telemetry:
  controller: true
  metrics: false
  otlp:
    destination: "http://prometheus-operated.monitoring.svc:9090/api/v1/otlp"
    interval: 60

autoscaling:
  enabled: false
  minReplicas: "0"
  maxReplicas: "0"

deployment:
  hostname: staging.canfar.net

  skaha:
    image: images-integration.canfar.net/skaha-system/skaha:2026.3-rc.3
    imagePullPolicy: Always
    registryURL:
      - https://staging.canfar.net/reg

    registryHosts: "images-integration.canfar.net"

    sessions:
      hostname: workloads.canfar.net
      namespace: 
        name: canfar-staging-workloads
        create: true
      userStorage:
        nodeURIPrefix: "vos://cadc.nrc.ca~arc"
        spec:
          persistentVolumeClaim:
            claimName: canfar-workloads-staging-pvc
      kueue:
        rbac:
          create: true
        default:
          queueName: "cadc-default"
          priorityClass: "high"
        headless:
          queueName: "cadc-default"
          priorityClass: "low"

      # Values that represent boundaries for the session resources.  Tune to your Cluster's capacity.
      limitRange:
        enabled: true
        rbac:
          create: true
        spec:
          # -- max is the maximum allowed requested for 'fixed' User Sessions.
          max:
            memory: "192Gi"
            cpu: "16"
            nvidia.com/gpu: "7"
          # -- default is the default limits for 'flex' User Sessions.  These Sessions will grow until this limit is reached.
          default:
            memory: "32Gi"
            cpu: "16"
            nvidia.com/gpu: "0"
          # -- defaultRequest is the default requests for 'flex' User Sessions.  All flex sessions will start with this request.
          defaultRequest:
            memory: "4Gi"
            cpu: "1"
            nvidia.com/gpu: "0"

      authorization:
        group:
          enabled: true
          uri: "ivo://cadc.nrc.ca/gms?skaha-users"

rbac:
  # Whether to create RBAC roles and bindings for Skaha.  Defaults to true.
  create: true

  # Node-capacity ClusterRole is unused for platform stats (Metrics backend owns
  # cluster totals). Capsule also cannot create cluster-scoped roles here.
  # Keep false; do not re-enable for stats.
  clusterRole:
    create: false

serviceAccount:
  create: true
